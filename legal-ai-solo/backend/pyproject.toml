[project]
name = "legal-ai-solo"
version = "0.1.0"
description = "Local legal research experiment: VKS case-law index and search"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "jinja2==3.1.5",
    "httpx==0.28.1",
    "psycopg[binary]==3.2.4",
    "lxml==5.3.0",
    "alembic==1.14.1",
    "sqlalchemy==2.0.37",
    "pypdf==6.19.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
legal-ai = "legal_ai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legal_ai = ["web/templates/*.html", "web/static/*.css", "web/static/kit/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
